function respawnEnemies() {
    const alive = enemies.filter(e => e.alive).length;
    if (alive < 8) {
        for (let i = 0; i < 4; i++) {
            const x = 5 + Math.random() * (MAP_W - 10);
            const z = 5 + Math.random() * (MAP_H - 10);
            if (gMap(Math.floor(x), Math.floor(z)) === 0) {
                if (Math.sqrt((x - player.x) ** 2 + (z - player.z) ** 2) > 18) {
                    enemies.push(new Enemy(x, z, ['pistol', 'rifle', 'rifle', 'heavy'][Math.floor(Math.random() * 4)]));
                }
            }
        }
    }
}

// ============================================================
// RENDERING
// ============================================================
function render() {
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    const fov = player.scoped ? FOV / (getWeapon()?.scopeZoom || 1) : FOV;
    const projScale = h / (2 * Math.tan(fov / 2));
    const eyeY = player.y + player.eyeH + player.headBob;
    zBuffer = new Float32Array(w);

    // === SKY with gradient ===
    const skyG = ctx.createLinearGradient(0, 0, 0, h * 0.48);
    skyG.addColorStop(0, '#0d1b2a');
    skyG.addColorStop(0.3, '#1b2838');
    skyG.addColorStop(0.6, '#2d4a5e');
    skyG.addColorStop(1, '#4a7a8c');
    ctx.fillStyle = skyG;
    ctx.fillRect(0, 0, w, h * 0.55);

    // Clouds
    const cloudOffset = performance.now() * 0.003;
    ctx.fillStyle = 'rgba(180,200,220,0.04)';
    for (let i = 0; i < 12; i++) {
        const cx = ((i * 317 + cloudOffset) % (w + 200)) - 100;
        const cy = 30 + (i * 53) % 80;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 80 + (i % 3) * 40, 15 + (i % 2) * 10, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // === FLOOR ===
    const floorG = ctx.createLinearGradient(0, h * 0.5, 0, h);
    floorG.addColorStop(0, '#4a4a38');
    floorG.addColorStop(0.3, '#3a3a28');
    floorG.addColorStop(1, '#1a1a0f');
    ctx.fillStyle = floorG;
    ctx.fillRect(0, h * 0.5, w, h * 0.5);

    // === WALLS — Raycasting ===
    const rayStep = Math.max(1, Math.floor(w / 960));
    for (let i = 0; i < w; i += rayStep) {
        const sx = (2 * i / w) - 1;
        const ra = player.yaw + Math.atan(sx * Math.tan(fov / 2));
        const ray = castRay(player.x, player.z, ra);
        const perpD = ray.dist * Math.cos(ra - player.yaw);

        for (let ri = 0; ri < rayStep && i + ri < w; ri++) zBuffer[i + ri] = perpD;

        if (ray.wt > 0 && perpD < RENDER_DIST) {
            const wh = ray.wh;
            const topW = wh - eyeY;
            const botW = 0 - eyeY;
            const topS = h / 2 - (topW / perpD) * projScale - player.pitch * projScale;
            const botS = h / 2 - (botW / perpD) * projScale - player.pitch * projScale;
            const wallSH = botS - topS;

            const shade = Math.max(0.08, 1 - perpD / RENDER_DIST);
            const sideShade = ray.side === 1 ? 0.72 : 1.0;
            const fs = shade * sideShade;

            const col = gColor(ray.mx, ray.mz);

            // Procedural texture pattern
            const tx = ray.hx;
            const brickH = wallSH > 10 ? (Math.floor(tx * 8) % 2 === 0 ? 0.96 : 1.0) : 1.0;
            // Vertical line accent
            const edgeDark = (tx < 0.03 || tx > 0.97) ? 0.85 : 1.0;

            const r = Math.floor(col.r * fs * brickH * edgeDark);
            const g = Math.floor(col.g * fs * brickH * edgeDark);
            const b = Math.floor(col.b * fs * brickH * edgeDark);

            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillRect(i, Math.floor(topS), rayStep, Math.ceil(wallSH) + 1);

            // Top edge highlight
            if (wallSH > 4) {
                ctx.fillStyle = `rgba(255,255,255,${fs * 0.08})`;
                ctx.fillRect(i, Math.floor(topS), rayStep, 2);
            }

            // Ambient occlusion at base
            if (wallSH > 8) {
                ctx.fillStyle = `rgba(0,0,0,${fs * 0.15})`;
                ctx.fillRect(i, Math.floor(botS) - 3, rayStep, 4);
            }

            // Floor with checker pattern
            for (let y = Math.max(Math.floor(botS), Math.floor(h / 2)); y < h; y += 4) {
                const rd = (eyeY * projScale) / (y - h / 2 + player.pitch * projScale);
                if (rd > 0 && rd < RENDER_DIST * 0.6) {
                    const fsh = Math.max(0.04, 1 - rd / (RENDER_DIST * 0.5)) * 0.55;
                    const fx = player.x + Math.cos(ra) * rd;
                    const fz = player.z + Math.sin(ra) * rd;
                    const ck = (Math.floor(fx * 2) + Math.floor(fz * 2)) % 2;
                    const fv = ck ? 0.55 : 0.42;
                    ctx.fillStyle = `rgb(${Math.floor(75 * fv * fsh)},${Math.floor(72 * fv * fsh)},${Math.floor(58 * fv * fsh)})`;
                    ctx.fillRect(i, y, rayStep, 4);
                }
            }
        }
    }

    // === Smoke zones (volumetric-ish) ===
    for (const sz of smokeZones) {
        const dx = sz.x - player.x, dz = sz.z - player.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < RENDER_DIST) {
            let angle = Math.atan2(dz, dx) - player.yaw;
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            if (Math.abs(angle) < fov / 2 + 0.5) {
                const perpD = dist * Math.cos(angle);
                if (perpD > 0.5) {
                    const scX = w / 2 + Math.tan(angle) * projScale;
                    const size = (sz.radius * 2 / perpD) * projScale;
                    const alpha = Math.min(0.7, (1 - dist / RENDER_DIST) * 0.8);
                    const grad = ctx.createRadialGradient(scX, h / 2, 0, scX, h / 2, size);
                    grad.addColorStop(0, `rgba(200,210,220,${alpha})`);
                    grad.addColorStop(0.5, `rgba(180,190,200,${alpha * 0.6})`);
                    grad.addColorStop(1, `rgba(160,170,180,0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(scX - size, h / 2 - size, size * 2, size * 2);
                }
            }
        }
    }

    // === Fire zones ===
    for (const fz of fireZones) {
        const dx = fz.x - player.x, dz = fz.z - player.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < RENDER_DIST) {
            let angle = Math.atan2(dz, dx) - player.yaw;
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            if (Math.abs(angle) < fov / 2 + 0.5) {
                const perpD = dist * Math.cos(angle);
                if (perpD > 0.5) {
                    const scX = w / 2 + Math.tan(angle) * projScale;
                    const size = (fz.radius * 2 / perpD) * projScale;
                    const flicker = 0.7 + Math.sin(performance.now() * 0.01) * 0.3;
                    const grad = ctx.createRadialGradient(scX, h / 2 + size * 0.3, 0, scX, h / 2, size);
                    grad.addColorStop(0, `rgba(255,120,20,${0.5 * flicker})`);
                    grad.addColorStop(0.5, `rgba(255,80,10,${0.3 * flicker})`);
                    grad.addColorStop(1, 'rgba(200,40,0,0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(scX - size, h / 2 - size * 0.5, size * 2, size * 1.5);
                }
            }
        }
    }

    // === SPRITES (enemies, pickups) ===
    const sprites = [];
    for (const e of enemies) {
        if (!e.alive && e.deathTimer > 8) continue;
        const dx = e.x - player.x, dz = e.z - player.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < RENDER_DIST && dist > 0.3) {
            let angle = Math.atan2(dz, dx) - player.yaw;
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            if (Math.abs(angle) < fov / 2 + 0.4)
                sprites.push({ type: 'enemy', obj: e, dist, angle });
        }
    }
    for (const p of pickups) {
        const dx = p.x - player.x, dz = p.z - player.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < RENDER_DIST && dist > 0.3) {
            let angle = Math.atan2(dz, dx) - player.yaw;
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            if (Math.abs(angle) < fov / 2 + 0.3)
                sprites.push({ type: 'pickup', obj: p, dist, angle });
        }
    }
    for (const g of grenades) {
        if (!g.alive) continue;
        const dx = g.x - player.x, dz = g.z - player.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < RENDER_DIST) {
            let angle = Math.atan2(dz, dx) - player.yaw;
            while (angle > Math.PI) angle -= Math.PI * 2;
            while (angle < -Math.PI) angle += Math.PI * 2;
            if (Math.abs(angle) < fov / 2 + 0.3)
                sprites.push({ type: 'grenade', obj: g, dist, angle });
        }
    }

    sprites.sort((a, b) => b.dist - a.dist);

    for (const sp of sprites) {
        const perpD = sp.dist * Math.cos(sp.angle);
        if (perpD <= 0.1) continue;
        const scX = w / 2 + Math.tan(sp.angle) * projScale;
        const cc = Math.floor(scX);
        if (cc < 0 || cc >= w) continue;

        if (sp.type === 'enemy') {
            const e = sp.obj;
            if (perpD >= zBuffer[Math.max(0, Math.min(w - 1, cc))]) continue;

            const shade = Math.max(0.12, 1 - sp.dist / RENDER_DIST);
            const sh = e.alive ? e.height : 0.35;
            const topY = (sh - eyeY) / perpD * projScale;
            const botY = (0 - eyeY) / perpD * projScale;
            const sTop = h / 2 - topY - player.pitch * projScale;
            const sBot = h / 2 - botY - player.pitch * projScale;
            const sH = sBot - sTop;
            const sW = (e.radius * 2 / perpD) * projScale;
            const sx = scX - sW / 2;

            if (e.alive) {
                const pain = e.painTimer > 0;

                // Shadow
                ctx.fillStyle = `rgba(0,0,0,${shade * 0.3})`;
                ctx.beginPath();
                ctx.ellipse(scX, sBot + 2, sW * 0.5, sW * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Legs
                ctx.fillStyle = `rgb(${Math.floor(50 * shade)},${Math.floor(52 * shade)},${Math.floor(60 * shade)})`;
                ctx.fillRect(sx + sW * 0.22, sTop + sH * 0.68, sW * 0.22, sH * 0.32);
                ctx.fillRect(sx + sW * 0.56, sTop + sH * 0.68, sW * 0.22, sH * 0.32);

                // Body / vest
                const bc = pain ? { r: 255, g: e.color.g * 0.3, b: e.color.b * 0.3 } : e.color;
                ctx.fillStyle = `rgb(${Math.floor(bc.r * shade)},${Math.floor(bc.g * shade)},${Math.floor(bc.b * shade)})`;
                ctx.fillRect(sx + sW * 0.15, sTop + sH * 0.22, sW * 0.7, sH * 0.48);

                // Vest detail
                ctx.fillStyle = `rgba(0,0,0,${shade * 0.15})`;
                ctx.fillRect(sx + sW * 0.3, sTop + sH * 0.25, sW * 0.4, sH * 0.15);

                // Arms
                ctx.fillStyle = `rgb(${Math.floor(bc.r * shade * 0.9)},${Math.floor(bc.g * shade * 0.9)},${Math.floor(bc.b * shade * 0.9)})`;
                ctx.fillRect(sx + sW * 0.02, sTop + sH * 0.24, sW * 0.15, sH * 0.32);
                ctx.fillRect(sx + sW * 0.83, sTop + sH * 0.24, sW * 0.15, sH * 0.32);

                // Head
                const headR = sW * 0.18;
                ctx.fillStyle = `rgb(${Math.floor(195 * shade)},${Math.floor(165 * shade)},${Math.floor(135 * shade)})`;
                ctx.beginPath();
                ctx.arc(scX, sTop + sH * 0.12, headR, 0, Math.PI * 2);
                ctx.fill();

                // Helmet
                ctx.fillStyle = `rgb(${Math.floor(70 * shade)},${Math.floor(80 * shade)},${Math.floor(70 * shade)})`;
                ctx.beginPath();
                ctx.arc(scX, sTop + sH * 0.1, headR * 1.1, -Math.PI, 0);
                ctx.fill();

                // Eyes
                ctx.fillStyle = `rgba(20,20,20,${shade})`;
                ctx.fillRect(scX - headR * 0.4, sTop + sH * 0.11, headR * 0.2, headR * 0.15);
                ctx.fillRect(scX + headR * 0.2, sTop + sH * 0.11, headR * 0.2, headR * 0.15);

                // Weapon in hands
                ctx.fillStyle = `rgb(${Math.floor(35 * shade)},${Math.floor(35 * shade)},${Math.floor(38 * shade)})`;
                ctx.fillRect(sx + sW * 0.82, sTop + sH * 0.35, sW * 0.45, sH * 0.05);

                // Health bar
                if (e.health < e.maxHealth) {
                    const bw = sW * 0.8, bh = 3;
                    const bx = scX - bw / 2, by = sTop - 10;
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
                    const hp = e.health / e.maxHealth;
                    ctx.fillStyle = hp > 0.6 ? '#4eff4e' : hp > 0.3 ? '#ffcc00' : '#ff3333';
                    ctx.fillRect(bx, by, bw * hp, bh);
                }

                // Enemy type indicator
                if (e.type === 'heavy') {
                    ctx.fillStyle = `rgba(255,80,80,${shade * 0.6})`;
                    ctx.beginPath();
                    ctx.arc(scX, sTop - 15, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                // Dead body
                const alpha = shade * Math.max(0, 1 - e.deathTimer / 8);
                ctx.fillStyle = `rgba(${e.color.r},${e.color.g},${e.color.b},${alpha})`;
                ctx.fillRect(sx, sBot - sH * 0.12, sW * 1.2, sH * 0.12);
            }
        } else if (sp.type === 'pickup') {
            const p = sp.obj;
            if (perpD >= zBuffer[Math.max(0, Math.min(w - 1, cc))]) continue;
            const size = (0.35 / perpD) * projScale;
            const bob = Math.sin(performance.now() * 0.004) * 0.12;
            const py = (0.5 + bob - eyeY) / perpD * projScale;
            const scY = h / 2 - py - player.pitch * projScale;
            const shade = Math.max(0.3, 1 - sp.dist / RENDER_DIST);
            const col = p.type === 'health' ? `rgba(50,255,80,${shade * 0.9})` : `rgba(255,210,50,${shade * 0.9})`;
            // Glow
            const glow = p.type === 'health' ? 'rgba(0,255,50,0.12)' : 'rgba(255,200,0,0.12)';
            ctx.fillStyle = glow;
            ctx.beginPath(); ctx.arc(scX, scY, size * 2.5, 0, Math.PI * 2); ctx.fill();
            // Item
            ctx.fillStyle = col;
            ctx.beginPath(); ctx.arc(scX, scY, size, 0, Math.PI * 2); ctx.fill();
            // Icon
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.max(8, size)}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(p.type === 'health' ? '+' : '•', scX, scY + size * 0.3);
        } else if (sp.type === 'grenade') {
            const g = sp.obj;
            if (perpD >= zBuffer[Math.max(0, Math.min(w - 1, cc))]) continue;
            const size = (0.15 / perpD) * projScale;
            const py = (g.y - eyeY) / perpD * projScale;
            const scY = h / 2 - py - player.pitch * projScale;
            ctx.fillStyle = g.type === 'frag' ? '#555' : g.type === 'smoke' ? '#888' : g.type === 'flash' ? '#ddd' : '#c40';
            ctx.beginPath(); ctx.arc(scX, scY, Math.max(2, size), 0, Math.PI * 2); ctx.fill();
        }
    }

    // === Bullet tracers ===
    for (const b of bullets) {
        if (!b.alive) continue;
        const dx = b.x - player.x, dz = b.z - player.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist > RENDER_DIST || dist < 0.5) continue;
        let angle = Math.atan2(dz, dx) - player.yaw;
        while (angle > Math.PI) angle -= Math.PI * 2;
        while (angle < -Math.PI) angle += Math.PI * 2;
        if (Math.abs(angle) < fov / 2 + 0.1) {
            const perpD = dist * Math.cos(angle);
            if (perpD > 0.1) {
                const bsX = w / 2 + Math.tan(angle) * projScale;
                const by = (b.y - eyeY) / perpD * projScale;
                const bsY = h / 2 - by - player.pitch * projScale;
                const size = Math.max(1, 2.5 / perpD);
                ctx.fillStyle = 'rgba(255,240,180,0.85)';
                ctx.beginPath(); ctx.arc(bsX, bsY, size, 0, Math.PI * 2); ctx.fill();
                // Trail
                ctx.strokeStyle = 'rgba(255,240,180,0.15)';
                ctx.lineWidth = Math.max(0.5, size * 0.5);
                for (let t = 0; t < b.trail.length - 1; t++) {
                    const t1 = b.trail[t], t2 = b.trail[t + 1];
                    const td1 = Math.sqrt((t1.x - player.x) ** 2 + (t1.z - player.z) ** 2);
                    const td2 = Math.sqrt((t2.x - player.x) ** 2 + (t2.z - player.z) ** 2);
                    if (td1 > 0.5 && td2 > 0.5) {
                        let a1 = Math.atan2(t1.z - player.z, t1.x - player.x) - player.yaw;
                        let a2 = Math.atan2(t2.z - player.z, t2.x - player.x) - player.yaw;
                        while (a1 > Math.PI) a1 -= Math.PI * 2; while (a1 < -Math.PI) a1 += Math.PI * 2;
                        while (a2 > Math.PI) a2 -= Math.PI * 2; while (a2 < -Math.PI) a2 += Math.PI * 2;
                        const pd1 = td1 * Math.cos(a1), pd2 = td2 * Math.cos(a2);
                        if (pd1 > 0.1 && pd2 > 0.1) {
                            ctx.beginPath();
                            ctx.moveTo(w / 2 + Math.tan(a1) * projScale, h / 2 - ((t1.y - eyeY) / pd1) * projScale - player.pitch * projScale);
                            ctx.lineTo(w / 2 + Math.tan(a2) * projScale, h / 2 - ((t2.y - eyeY) / pd2) * projScale - player.pitch * projScale);
                            ctx.stroke();
                        }
                    }
                }
            }
        }
    }

    // === Particles ===
    for (const p of particles) {
        const dx = p.x - player.x, dz = p.z - player.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist > RENDER_DIST || dist < 0.3) continue;
        let angle = Math.atan2(dz, dx) - player.yaw;
        while (angle > Math.PI) angle -= Math.PI * 2;
        while (angle < -Math.PI) angle += Math.PI * 2;
        if (Math.abs(angle) < fov / 2 + 0.1) {
            const perpD = dist * Math.cos(angle);
            if (perpD > 0.1) {
                const psX = w / 2 + Math.tan(angle) * projScale;
                const py = (p.y - eyeY) / perpD * projScale;
                const psY = h / 2 - py - player.pitch * projScale;
                const alpha = p.life / p.maxLife;
                const size = Math.max(0.5, p.size / perpD);
                ctx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${alpha})`;
                ctx.beginPath(); ctx.arc(psX, psY, size, 0, Math.PI * 2); ctx.fill();
            }
        }
    }

    // === FIRST PERSON HANDS & WEAPON ===
    renderFirstPersonWeapon(w, h);

    // === HUD ===
    renderHUD(w, h);

    // === Effects ===
    // Damage flash
    if (player.dmgFlash > 0) {
        ctx.fillStyle = `rgba(255,20,0,${player.dmgFlash * 0.25})`;
        ctx.fillRect(0, 0, w, h);
        // Directional indicator
        const da = player.dmgDir - player.yaw;
        const ix = w / 2 + Math.cos(da) * 180;
        const iy = h / 2 + Math.sin(da) * 180;
        const dmgGrad = ctx.createRadialGradient(ix, iy, 0, ix, iy, 60);
        dmgGrad.addColorStop(0, `rgba(255,0,0,${player.dmgFlash * 0.5})`);
        dmgGrad.addColorStop(1, 'rgba(255,0,0,0)');
        ctx.fillStyle = dmgGrad;
        ctx.beginPath(); ctx.arc(ix, iy, 60, 0, Math.PI * 2); ctx.fill();
    }

    // Flash effect
    if (player.flashAmount > 0) {
        ctx.fillStyle = `rgba(255,255,255,${Math.min(1, player.flashAmount)})`;
        ctx.fillRect(0, 0, w, h);
    }

    // Landing shock
    if (player.landingShock > 0) {
        ctx.fillStyle = `rgba(0,0,0,${player.landingShock * 0.15})`;
        ctx.fillRect(0, h - h * player.landingShock * 0.1, w, h * player.landingShock * 0.1);
    }

    // Scope overlay
    if (player.scoped) {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
        // Scope circle
        ctx.fillStyle = '#000';
        const scopeR = Math.min(w, h) * 0.45;
        ctx.beginPath(); ctx.rect(0, 0, w, h);
        ctx.arc(w / 2, h / 2, scopeR, 0, Math.PI * 2, true);
        ctx.fill();
        // Mil-dots
        for (let i = 1; i <= 4; i++) {
            const md = scopeR * i / 5;
            ctx.fillStyle = '#000';
            ctx.fillRect(w / 2 + md - 1, h / 2 - 4, 2, 8);
            ctx.fillRect(w / 2 - md - 1, h / 2 - 4, 2, 8);
            ctx.fillRect(w / 2 - 4, h / 2 + md - 1, 8, 2);
            ctx.fillRect(w / 2 - 4, h / 2 - md - 1, 8, 2);
        }
    }

    // Death screen
    if (!player.alive) {
        ctx.fillStyle = 'rgba(80,0,0,0.7)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 56px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('ELIMINATED', w / 2, h / 2 - 20);
        ctx.font = '18px Segoe UI';
        ctx.fillStyle = '#ccc';
        ctx.fillText(`Score: ${player.score} | K/D: ${player.kills}/${player.deaths}`, w / 2, h / 2 + 20);
        ctx.fillText('Press R to respawn', w / 2, h / 2 + 55);
    }
}

function renderFirstPersonWeapon(w, h) {
    const wep = getWeapon();
    const wKey = getWeaponKey();
    if (!wep || player.scoped) return;

    const bobX = Math.sin(player.weaponBob) * 6 * (player.sprinting ? 3 : 1);
    const bobY = Math.abs(Math.cos(player.weaponBob)) * 4 * (player.sprinting ? 3 : 1);
    const swayX = player.weaponSway.x;
    const swayY = player.weaponSway.y;
    const recoilY = player.recoilPitch * 180;
    const recoilX = player.recoilYaw * 80;

    let baseX = w * 0.62 + bobX + swayX + recoilX;
    let baseY = h * 0.62 + bobY + swayY + recoilY;

    // Reload anim
    let reloadOff = 0;
    if (player.reloading && wep.reloadTime) {
        const t = 1 - (player.reloadTimer / wep.reloadTime);
        reloadOff = Math.sin(t * Math.PI) * 70;
    }

    // Sprint tilt
    let sprintTilt = 0;
    if (player.sprinting) sprintTilt = Math.sin(player.weaponBob * 0.5) * 15;

    // Inspect animation
    let inspectAngle = 0;
    if (player.inspecting) {
        inspectAngle = Math.sin(player.inspectTimer * 2) * 30;
        baseX += Math.sin(player.inspectTimer * 2) * 50;
    }

    // Landing shock
    baseY += player.landingShock * 30;

    const wpX = baseX;
    const wpY = baseY + reloadOff;

    ctx.save();
    ctx.translate(wpX, wpY);
    ctx.rotate((sprintTilt + inspectAngle) * Math.PI / 180);

    // === HAND (left arm visible) ===
    // Skin color with shading
    const skinR = 195, skinG = 160, skinB = 130;

    if (wep.type === 'melee') {
        // Knife view
        // Arm
        ctx.fillStyle = `rgb(${skinR - 20},${skinG - 15},${skinB - 10})`;
        ctx.fillRect(-30, -20, 55, 80);
        // Sleeve
        ctx.fillStyle = '#3a3a3a';
        ctx.fillRect(-30, 40, 55, 25);
        // Blade
        ctx.fillStyle = '#b0b5c0';
        ctx.beginPath();
        ctx.moveTo(-10, -80); ctx.lineTo(5, -80);
        ctx.lineTo(10, -20); ctx.lineTo(-15, -20);
        ctx.closePath(); ctx.fill();
        // Handle
        ctx.fillStyle = '#2a2015';
        ctx.fillRect(-12, -22, 25, 35);
        // Edge highlight
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(-8, -75, 2, 55);
    } else {
        // === GUN HANDS ===
        // Right arm (gripping)
        ctx.fillStyle = '#333';
        ctx.fillRect(0, 15, 35, 60); // Sleeve
        ctx.fillStyle = `rgb(${skinR},${skinG},${skinB})`;
        ctx.fillRect(2, -5, 30, 25); // Hand
        // Fingers
        ctx.fillStyle = `rgb(${skinR - 10},${skinG - 8},${skinB - 5})`;
        for (let f = 0; f < 4; f++) {
            ctx.fillRect(5 + f * 7, -12, 5, 10);
        }

        // Left hand (support)
        if (wep.type !== 'pistol') {
            ctx.fillStyle = '#333';
            ctx.fillRect(-80, 5, 40, 45);
            ctx.fillStyle = `rgb(${skinR},${skinG},${skinB})`;
            ctx.fillRect(-75, -8, 30, 18);
            ctx.fillStyle = `rgb(${skinR - 10},${skinG - 8},${skinB - 5})`;
            for (let f = 0; f < 4; f++) ctx.fillRect(-72 + f * 7, -15, 5, 10);
        }

        // === WEAPON MODEL ===
        switch (wep.type) {
            case 'pistol':
                // Barrel
                ctx.fillStyle = '#252525';
                ctx.fillRect(-8, -55, 28, 12);
                // Slide
                ctx.fillStyle = '#3a3a3c';
                ctx.fillRect(-10, -45, 32, 28);
                // Slide serrations
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                for (let s = 0; s < 5; s++) ctx.fillRect(-8 + s * 5, -43, 2, 20);
                // Frame
                ctx.fillStyle = '#2e2e30';
                ctx.fillRect(-6, -17, 24, 12);
                // Grip
                ctx.fillStyle = wKey === 'deagle' ? '#383030' : '#252018';
                ctx.fillRect(-3, -5, 20, 40);
                // Grip texture
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                for (let g = 0; g < 6; g++) ctx.fillRect(0, g * 6, 14, 1);
                // Trigger
                ctx.fillStyle = '#222';
                ctx.beginPath(); ctx.arc(5, -2, 6, 0, Math.PI); ctx.fill();
                // Sight
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(4, -60, 4, 7);
                ctx.fillRect(12, -58, 3, 5);
                // Sight dot
                ctx.fillStyle = '#0f0';
                ctx.fillRect(5, -59, 2, 2);
                break;

            case 'smg':
                // Stock tube
                ctx.fillStyle = '#2a2a2c';
                ctx.fillRect(25, -12, 50, 10);
                // Receiver
                ctx.fillStyle = '#333338';
                ctx.fillRect(-35, -22, 70, 20);
                // Barrel
                ctx.fillStyle = '#292929';
                ctx.fillRect(-75, -18, 45, 8);
                // Suppressor (for MP5-SD)
                if (wep.silenced) {
                    ctx.fillStyle = '#2a2a2a';
                    ctx.fillRect(-90, -22, 20, 16);
                }
                // Handguard
                ctx.fillStyle = '#303035';
                ctx.fillRect(-55, -22, 25, 14);
                // Magazine
                ctx.fillStyle = '#252525';
                ctx.fillRect(-5, -2, 14, 35);
                // Grip
                ctx.fillStyle = '#252018';
                ctx.fillRect(15, -2, 16, 30);
                // Sights
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(-25, -30, 25, 6);
                break;

            case 'rifle':
                // Buttstock
                ctx.fillStyle = wKey === 'ak47' ? '#3a2815' : '#2a2a2e';
                ctx.fillRect(30, -18, 55, 22);
                // Stock cheek rest
                ctx.fillStyle = wKey === 'ak47' ? '#33220f' : '#252528';
                ctx.fillRect(60, -22, 20, 8);
                // Receiver
                ctx.fillStyle = wKey === 'ak47' ? '#444' : '#353538';
                ctx.fillRect(-30, -25, 68, 20);
                // Barrel
                ctx.fillStyle = '#2e2e2e';
                ctx.fillRect(-85, -22, 60, 9);
                // Suppressor/Flash hider
                if (wep.silenced) {
                    ctx.fillStyle = '#282828';
                    ctx.fillRect(-105, -25, 24, 15);
                } else {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-92, -24, 10, 12);
                }
                // Handguard
                ctx.fillStyle = wKey === 'ak47' ? '#3a2815' : '#303035';
                ctx.fillRect(-60, -25, 35, 16);
                // Gas tube (AK)
                if (wKey === 'ak47') {
                    ctx.fillStyle = '#555';
                    ctx.fillRect(-55, -30, 30, 4);
                }
                // Magazine
                ctx.fillStyle = wKey === 'ak47' ? '#444' : '#252528';
                const magAngle = wKey === 'ak47' ? 0.15 : 0;
                ctx.save(); ctx.rotate(magAngle);
                ctx.fillRect(-10, -3, 14, 38);
                ctx.restore();
                // Grip
                ctx.fillStyle = wKey === 'ak47' ? '#2a1a08' : '#252018';
                ctx.fillRect(12, -3, 16, 30);
                // Carry handle / rail
                ctx.fillStyle = '#2a2a2d';
                ctx.fillRect(-20, -35, 35, 7);
                // Sights
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(-15, -40, 3, 8);
                ctx.fillRect(8, -38, 3, 6);
                // Sight post
                ctx.fillStyle = '#0f0';
                ctx.fillRect(-14, -40, 1, 3);
                break;

            case 'sniper':
                // Buttstock (large)
                ctx.fillStyle = '#2a2a2c';
                ctx.fillRect(20, -20, 70, 26);
                ctx.fillStyle = '#222225';
                ctx.fillRect(70, -16, 15, 18);
                // Receiver
                ctx.fillStyle = '#333338';
                ctx.fillRect(-40, -28, 68, 22);
                // Long barrel
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(-120, -24, 85, 10);
                // Muzzle brake
                ctx.fillStyle = '#383838';
                ctx.fillRect(-128, -27, 12, 16);
                // Scope
                ctx.fillStyle = '#222';
                ctx.fillRect(-25, -48, 45, 14);
                ctx.fillStyle = '#1a1a2a';
                ctx.beginPath(); ctx.arc(-25, -41, 7, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(20, -41, 6, 0, Math.PI * 2); ctx.fill();
                // Scope lens
                ctx.fillStyle = 'rgba(100,150,255,0.3)';
                ctx.beginPath(); ctx.arc(-25, -41, 5, 0, Math.PI * 2); ctx.fill();
                // Magazine
                ctx.fillStyle = '#252528';
                ctx.fillRect(-8, -5, 16, 30);
                // Grip
                ctx.fillStyle = '#252018';
                ctx.fillRect(8, -5, 18, 30);
                // Bipod (folded)
                ctx.fillStyle = '#333';
                ctx.fillRect(-50, -6, 3, 20);
                break;

            case 'shotgun':
                // Stock
                ctx.fillStyle = '#4a3218';
                ctx.fillRect(20, -18, 65, 24);
                // Receiver
                ctx.fillStyle = '#333';
                ctx.fillRect(-35, -22, 60, 18);
                // Barrel (thick)
                ctx.fillStyle = '#2e2e2e';
                ctx.fillRect(-85, -22, 55, 14);
                // Magazine tube
                ctx.fillStyle = '#353535';
                ctx.fillRect(-80, -8, 50, 8);
                // Pump / forend
                ctx.fillStyle = '#3a2815';
                ctx.fillRect(-50, -24, 22, 22);
                // Grip
                ctx.fillStyle = '#2a1a08';
                ctx.fillRect(8, -3, 16, 35);
                // Trigger guard
                ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(5, 2, 8, 0, Math.PI); ctx.stroke();
                // Bead sight
                ctx.fillStyle = '#ff0';
                ctx.beginPath(); ctx.arc(-82, -24, 2, 0, Math.PI * 2); ctx.fill();
                break;
        }

        // Muzzle flash effect
        if (player.fireTimer > (wep.fireRate || 0.5) * 0.75) {
            const flashX = wep.type === 'pistol' ? -5 : -90;
            const flashY = wep.type === 'pistol' ? -58 : -20;
            const flashSize = 18 + Math.random() * 15;
            const fg = ctx.createRadialGradient(flashX, flashY, 0, flashX, flashY, flashSize);
            fg.addColorStop(0, 'rgba(255,255,220,0.95)');
            fg.addColorStop(0.2, 'rgba(255,200,80,0.7)');
            fg.addColorStop(0.5, 'rgba(255,120,20,0.3)');
            fg.addColorStop(1, 'rgba(255,60,0,0)');
            ctx.fillStyle = fg;
            ctx.beginPath(); ctx.arc(flashX, flashY, flashSize, 0, Math.PI * 2); ctx.fill();

            // Light on hands
            ctx.fillStyle = 'rgba(255,200,100,0.15)';
            ctx.fillRect(-30, -30, 80, 80);
        }
    }

    ctx.restore();
}

function renderHUD(w, h) {
    const wep = getWeapon();
    const wKey = getWeaponKey();

    // === CROSSHAIR ===
    if (player.alive && !player.scoped) {
        const hSpd = player.velocitySmooth;
        let cSize = 6;
        if (hSpd > 1) cSize += hSpd * 2.5;
        if (player.sprinting) cSize += 12;
        if (!player.onGround) cSize += 18;
        cSize += Math.abs(player.recoilPitch) * 80;
        if (player.crouching) cSize *= 0.7;

        const cx = w / 2, cy = h / 2;
        const gap = cSize;
        const len = 6;
        const thick = 1.5;

        // Outline
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = thick + 1.5;
        drawCrosshair(cx, cy, gap, len);
        // Main
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = thick;
        drawCrosshair(cx, cy, gap, len);

        // Center dot
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath(); ctx.arc(cx, cy, 1.2, 0, Math.PI * 2); ctx.fill();
    }

    // Hitmarker
    if (player.hitmarkerTimer > 0) {
        const hma = player.hitmarkerTimer / 0.15;
        const hmCol = player.headshotHit ? `rgba(255,50,50,${hma})` : `rgba(255,255,255,${hma})`;
        ctx.strokeStyle = hmCol;
        ctx.lineWidth = 2;
        const hms = 8;
        const cx = w / 2, cy = h / 2;
        ctx.beginPath();
        ctx.moveTo(cx - hms, cy - hms); ctx.lineTo(cx - hms / 2, cy - hms / 2);
        ctx.moveTo(cx + hms, cy - hms); ctx.lineTo(cx + hms / 2, cy - hms / 2);
        ctx.moveTo(cx - hms, cy + hms); ctx.lineTo(cx - hms / 2, cy + hms / 2);
        ctx.moveTo(cx + hms, cy + hms); ctx.lineTo(cx + hms / 2, cy + hms / 2);
        ctx.stroke();
    }

    // === BOTTOM HUD PANEL ===
    // Background panel
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, h - 90, w, 90);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(0, h - 90, w, 1);

    // Health
    const hpY = h - 65;
    const hpW = 180;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(25, hpY, hpW, 14);
    const hpPct = player.health / player.maxHealth;
    const hpCol = hpPct > 0.6 ? '#4eff4e' : hpPct > 0.3 ? '#ffcc00' : '#ff3333';
    ctx.fillStyle = hpCol;
    ctx.fillRect(25, hpY, hpW * hpPct, 14);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Segoe UI';
    ctx.textAlign = 'left';
    ctx.fillText(`${Math.ceil(player.health)}`, 30, hpY + 12);
    // Health icon
    ctx.fillStyle = hpCol;
    ctx.font = '11px Segoe UI';
    ctx.fillText('HP', 25, hpY - 4);

    // Armor
    const arY = hpY + 22;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(25, arY, hpW, 10);
    ctx.fillStyle = '#4488ff';
    ctx.fillRect(25, arY, hpW * (player.armor / 100), 10);
    ctx.fillStyle = '#88aaff';
    ctx.font = '11px Segoe UI';
    ctx.fillText(`ARMOR ${Math.ceil(player.armor)}${player.helmet ? ' +H' : ''}`, 25, arY - 3);

    // Stamina
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(25, arY + 16, hpW, 4);
    ctx.fillStyle = player.stamina > 25 ? '#cc0' : '#f80';
    ctx.fillRect(25, arY + 16, hpW * (player.stamina / PHYSICS.staminaMax), 4);

    // Money
    ctx.fillStyle = '#5dff5d';
    ctx.font = 'bold 18px Segoe UI';
    ctx.textAlign = 'left';
    ctx.fillText(`$${player.money}`, 25, h - 72);

    // === AMMO ===
    if (wep && wep.magSize) {
        ctx.textAlign = 'right';
        ctx.font = 'bold 38px Segoe UI';
        const ammoLow = (player.ammo[wKey] || 0) <= Math.floor(wep.magSize * 0.2);
        ctx.fillStyle = ammoLow ? '#ff3333' : '#fff';
        ctx.fillText(`${player.ammo[wKey] || 0}`, w - 90, h - 35);
        ctx.font = '20px Segoe UI';
        ctx.fillStyle = '#888';
        ctx.fillText(`/ ${player.reserveAmmo[wKey] || 0}`, w - 25, h - 35);

        // Weapon name
        ctx.font = '13px Segoe UI';
        ctx.fillStyle = '#aaa';
        ctx.fillText(wep.name, w - 25, h - 68);

        // Fire mode
        ctx.font = '10px Segoe UI';
        ctx.fillStyle = '#666';
        ctx.fillText(wep.automatic ? 'AUTO' : 'SEMI', w - 25, h - 55);
    } else if (wep) {
        ctx.textAlign = 'right';
        ctx.font = '13px Segoe UI';
        ctx.fillStyle = '#aaa';
        ctx.fillText(wep.name, w - 25, h - 50);
    }

    // Reload indicator
    if (player.reloading && wep) {
        const rw = 120, rh = 14;
        const rx = w / 2 - rw / 2, ry = h / 2 + 60;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(rx - 1, ry - 1, rw + 2, rh + 2);
        const rPct = 1 - (player.reloadTimer / wep.reloadTime);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(rx, ry, rw * rPct, rh);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('RELOADING', w / 2, ry - 5);
    }

    // === WEAPON SLOTS ===
    const slotNames = ['primary', 'secondary', 'melee'];
    ctx.textAlign = 'center';
    for (let i = 0; i < 3; i++) {
        const slotX = w / 2 - 120 + i * 85;
        const slotY = h - 15;
        const active = i === player.currentSlot;
        const hasWep = player.inventory[slotNames[i]] != null;
        ctx.fillStyle = active ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.2)';
        ctx.fillRect(slotX - 35, slotY - 10, 70, 20);
        ctx.strokeStyle = active ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.08)';
        ctx.lineWidth = active ? 1.5 : 0.5;
        ctx.strokeRect(slotX - 35, slotY - 10, 70, 20);
        ctx.fillStyle = active ? '#fff' : (hasWep ? '#888' : '#444');
        ctx.font = '10px Segoe UI';
        const wn = hasWep ? WEAPON_DB[player.inventory[slotNames[i]]].name.split(' ')[0] : '-';
        ctx.fillText(`${i + 1} ${wn}`, slotX, slotY + 4);
    }

    // Utility slot
    if (player.inventory.utilities.length > 0) {
        const uSlotX = w / 2 + 145;
        const active = player.currentSlot === 3;
        ctx.fillStyle = active ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.2)';
        ctx.fillRect(uSlotX - 35, h - 25, 70, 20);
        ctx.strokeStyle = active ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.08)';
        ctx.strokeRect(uSlotX - 35, h - 25, 70, 20);
        ctx.fillStyle = '#aaa';
        ctx.font = '10px Segoe UI';
        ctx.fillText(`4 ${UTILITY_DB[player.inventory.utilities[0]]?.name.split(' ')[0] || ''}`, uSlotX, h - 11);
    }

    // === SCORE / KILLS ===
    ctx.textAlign = 'left';
    ctx.font = 'bold 15px Segoe UI';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Score: ${player.score}`, 25, 28);
    ctx.font = '13px Segoe UI';
    ctx.fillStyle = '#ccc';
    ctx.fillText(`K: ${player.kills}  D: ${player.deaths}`, 25, 48);

    const aliveE = enemies.filter(e => e.alive).length;
    ctx.fillStyle = '#f44';
    ctx.fillText(`Enemies: ${aliveE}`, 25, 66);

    // === KILL FEED ===
    for (let i = 0; i < player.killFeed.length; i++) {
        const kf = player.killFeed[i];
        const kfY = 30 + i * 24;
        const kfAlpha = Math.min(1, kf.time);
        ctx.fillStyle = `rgba(0,0,0,${0.5 * kfAlpha})`;
        ctx.fillRect(w - 250, kfY - 12, 230, 20);
        ctx.font = '12px Segoe UI';
        ctx.textAlign = 'right';
        ctx.fillStyle = `rgba(255,255,255,${kfAlpha})`;
        ctx.fillText(`You ${kf.headshot ? '⊕' : '→'} ${kf.name}`, w - 25, kfY + 2);
    }

    // === MINIMAP ===
    const mmS = 150;
    const mmX = w - mmS - 15;
    const mmY = player.killFeed.length * 24 + 45;

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(mmX - 2, mmY - 2, mmS + 4, mmS + 4);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.strokeRect(mmX - 2, mmY - 2, mmS + 4, mmS + 4);

    const mmScale = mmS / MAP_W;
    for (let x = 0; x < MAP_W; x++) for (let z = 0; z < MAP_H; z++) {
        if (gMap(x, z) > 0) {
            const c = gColor(x, z);
            ctx.fillStyle = `rgb(${Math.floor(c.r * 0.4)},${Math.floor(c.g * 0.4)},${Math.floor(c.b * 0.4)})`;
            ctx.fillRect(mmX + x * mmScale, mmY + z * mmScale, Math.ceil(mmScale), Math.ceil(mmScale));
        }
    }

    // Player
    ctx.fillStyle = '#4eff4e';
    ctx.beginPath(); ctx.arc(mmX + player.x * mmScale, mmY + player.z * mmScale, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#4eff4e'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(mmX + player.x * mmScale, mmY + player.z * mmScale);
    ctx.lineTo(mmX + (player.x + Math.cos(player.yaw) * 3) * mmScale, mmY + (player.z + Math.sin(player.yaw) * 3) * mmScale);
    ctx.stroke();

    // Enemies on minimap
    for (const e of enemies) {
        if (!e.alive) continue;
        const ed = Math.sqrt((e.x - player.x) ** 2 + (e.z - player.z) ** 2);
        if (ed < 25) {
            ctx.fillStyle = e.state === 'patrol' ? '#ff0' : '#f33';
            ctx.beginPath(); ctx.arc(mmX + e.x * mmScale, mmY + e.z * mmScale, 2, 0, Math.PI * 2); ctx.fill();
        }
    }

    // Pickups
    for (const p of pickups) {
        ctx.fillStyle = p.type === 'health' ? '#0f0' : '#ff0';
        ctx.fillRect(mmX + p.x * mmScale - 1, mmY + p.z * mmScale - 1, 3, 3);
    }

    // Smoke/fire zones on minimap
    for (const sz of smokeZones) {
        ctx.fillStyle = 'rgba(200,200,200,0.3)';
        ctx.beginPath(); ctx.arc(mmX + sz.x * mmScale, mmY + sz.z * mmScale, sz.radius * mmScale, 0, Math.PI * 2); ctx.fill();
    }
    for (const fz of fireZones) {
        ctx.fillStyle = 'rgba(255,100,0,0.3)';
        ctx.beginPath(); ctx.arc(mmX + fz.x * mmScale, mmY + fz.z * mmScale, fz.radius * mmScale, 0, Math.PI * 2); ctx.fill();
    }

    // FPS
    ctx.textAlign = 'right';
    ctx.font = '11px Segoe UI';
    ctx.fillStyle = '#666';
    ctx.fillText(`${fps} FPS`, w - 20, h - 95);
}

function drawCrosshair(cx, cy, gap, len) {
    ctx.beginPath();
    ctx.moveTo(cx - gap - len, cy); ctx.lineTo(cx - gap, cy);
    ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + gap + len, cy);
    ctx.moveTo(cx, cy - gap - len); ctx.lineTo(cx, cy - gap);
    ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, cy + gap + len);
    ctx.stroke();
}

// ============================================================
// GAME LOOP
// ============================================================
let respawnClock = 0;

function loop(timestamp) {
    if (!gameRunning) return;

    dt = Math.min((timestamp - lastTime) / 1000, 0.04);
    lastTime = timestamp;

    frameCount++;
    fpsTime += dt;
    if (fpsTime >= 1) { fps = frameCount; frameCount = 0; fpsTime = 0; }

    // Player
    if (player.alive) {
        updatePlayer(dt);
    } else {
        if (keys['KeyR']) {
            player.alive = true;
            player.health = player.maxHealth;
            player.armor = 0; player.helmet = false;
            player.x = 8; player.z = 8; player.y = 0;
            player.vx = 0; player.vy = 0; player.vz = 0;
            player.reloading = false;
            player.flashAmount = 0;
        }
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update(dt);
        if (!bullets[i].alive) bullets.splice(i, 1);
    }

    // Enemies
    for (const e of enemies) e.update(dt);
    for (let i = enemies.length - 1; i >= 0; i--) {
        if (!enemies[i].alive && enemies[i].deathTimer > 12) enemies.splice(i, 1);
    }

    // Grenades
    for (let i = grenades.length - 1; i >= 0; i--) {
        grenades[i].update(dt);
        if (!grenades[i].alive) grenades.splice(i, 1);
    }

    // Smoke zones
    for (let i = smokeZones.length - 1; i >= 0; i--) {
        smokeZones[i].timer -= dt;
        if (smokeZones[i].timer <= 0) smokeZones.splice(i, 1);
    }

    // Fire zones
    for (let i = fireZones.length - 1; i >= 0; i--) {
        fireZones[i].timer -= dt;
        // Damage enemies in fire
        for (const e of enemies) {
            if (!e.alive) continue;
            const d = Math.sqrt((e.x - fireZones[i].x) ** 2 + (e.z - fireZones[i].z) ** 2);
            if (d < fireZones[i].radius) e.takeDamage(fireZones[i].dps * dt, 0);
        }
        if (fireZones[i].timer <= 0) fireZones.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy -= PHYSICS.gravity * dt;
        p.vx *= 0.97; p.vz *= 0.97;
        p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
        if (p.y < 0) { p.y = 0; p.vy = 0; p.vx *= 0.4; p.vz *= 0.4; }
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Decals
    for (let i = decals.length - 1; i >= 0; i--) {
        decals[i].life -= dt;
        if (decals[i].life <= 0) decals.splice(i, 1);
    }

    // Respawn
    respawnClock += dt;
    if (respawnClock > 12) { respawnClock = 0; respawnEnemies(); }

    // Reset recoil pattern when not shooting
    if (player.fireTimer <= 0) player.recoilPattern = Math.max(0, player.recoilPattern - dt * 8);

    render();
    requestAnimationFrame(loop);
}

// ============================================================
// INPUT
// ============================================================
document.addEventListener('keydown', e => {
    keys[e.code] = true;

    if (e.code === 'Digit1') { player.currentSlot = 0; player.reloading = false; player.inspecting = false; }
    if (e.code === 'Digit2') { player.currentSlot = 1; player.reloading = false; player.inspecting = false; }
    if (e.code === 'Digit3') { player.currentSlot = 2; player.reloading = false; player.inspecting = false; }
    if (e.code === 'Digit4') {
        if (player.inventory.utilities.length > 0) {
            throwGrenade(player.inventory.utilities[0]);
        }
    }
    if (e.code === 'Digit5') { player.currentSlot = 3; }
    if (e.code === 'KeyR' && player.alive) startReload();
    if (e.code === 'KeyB') toggleBuyMenu();
    if (e.code === 'KeyQ') {
        const tmp = player.currentSlot;
        player.currentSlot = player.prevSlot;
        player.prevSlot = tmp;
        player.reloading = false;
    }
    if (e.code === 'KeyF') {
        player.inspecting = !player.inspecting;
        player.inspectTimer = 0;
    }
    if (e.code === 'KeyG') {
        // Drop current weapon
        const slots = ['primary', 'secondary', 'melee'];
        if (player.currentSlot <= 1) {
            const slot = slots[player.currentSlot];
            if (player.inventory[slot] && slot !== 'melee') {
                player.inventory[slot] = null;
                if (player.currentSlot === 0) player.currentSlot = 1;
            }
        }
    }
    if (e.code === 'Escape' && buyMenuOpen) toggleBuyMenu();
});

document.addEventListener('keyup', e => { keys[e.code] = false; });

document.addEventListener('mousemove', e => {
    if (ptrLocked) { mouseDX += e.movementX; mouseDY += e.movementY; }
});

document.addEventListener('mousedown', e => {
    if (e.button === 0) mouseDown = true;
    if (e.button === 2) mouse2Down = true;
});

document.addEventListener('mouseup', e => {
    if (e.button === 0) mouseDown = false;
    if (e.button === 2) mouse2Down = false;
});

document.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('wheel', e => {
    if (buyMenuOpen) return;
    const dir = e.deltaY > 0 ? 1 : -1;
    player.currentSlot = (player.currentSlot + dir + 3) % 3;
    player.reloading = false;
    player.inspecting = false;
});

function lockPtr() { canvas.requestPointerLock(); }
document.addEventListener('pointerlockchange', () => {
    ptrLocked = document.pointerLockElement === canvas;
    if (!ptrLocked && gameRunning) blocker.style.display = 'flex';
});

// ============================================================
// START
// ============================================================
document.getElementById('startBtn').addEventListener('click', () => {
    blocker.style.display = 'none';
    lockPtr();
    if (!gameRunning) {
        generateMap();
        spawnEnemies();
        initAmmo();
        for (let i = 0; i < 12; i++) {
            const x = 3 + Math.random() * (MAP_W - 6);
            const z = 3 + Math.random() * (MAP_H - 6);
            if (gMap(Math.floor(x), Math.floor(z)) === 0)
                pickups.push({ x, z, type: Math.random() < 0.5 ? 'health' : 'ammo', amount: 25 });
        }
        gameRunning = true;
        lastTime = performance.now();
        requestAnimationFrame(loop);
    }
});

canvas.addEventListener('click', () => {
    if (gameRunning && !ptrLocked) { lockPtr(); blocker.style.display = 'none'; }
});
</script>
