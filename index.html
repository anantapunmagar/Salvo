    border: none; color: #fff; cursor: pointer;
    letter-spacing: 4px; text-transform: uppercase;

#blocker button:hover {

#buyMenu .category {

#buyMenu .item {

    border-radius: 6px; padding: 10px 15px; margin: 4px 0; cursor: pointer;

}

#buyMenu .item:hover {
    background: rgba(255,70,70,0.1); border-color: rgba(255,70,70,0.3);

#buyMenu .item .name { color: #ddd; font-size: 14px; font-weight: 600; }
#buyMenu .item .price { color: #ffcc00; font-size: 14px; font-weight: 700; }
#buyMenu .item .info { color: #888; font-size: 11px; }

#buyMenu .money-display {

#buyMenu .close-hint {
    text-align: center; color: #666; font-size: 12px; margin-top: 15px;

function setWall(x, z, type, h, color) {
    if (x >= 0 && x < MAP_W && z >= 0 && z < MAP_H) {
        const i = z * MAP_W + x;
        map[i] = type;
        mapHeight[i] = h;
        mapColor[i] = color || { r: 128, g: 128, b: 128 };
    }
}

function clearWall(x, z) {
    if (x >= 0 && x < MAP_W && z >= 0 && z < MAP_H) {
        map[z * MAP_W + x] = 0;
    }
}

function buildBox(x, z, w, h, type, wh, color) {
    for (let ix = x; ix < x + w; ix++) {
        for (let iz = z; iz < z + h; iz++) {
            if (ix === x || ix === x + w - 1 || iz === z || iz === z + h - 1) {
                setWall(ix, iz, type, wh, color);
            }
        }
    }
}

function buildLine(x1, z1, x2, z2, type, wh, color) {
    if (x1 === x2) {
        for (let z = Math.min(z1, z2); z <= Math.max(z1, z2); z++) setWall(x1, z, type, wh, color);
    } else {
        for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) setWall(x, z1, type, wh, color);
    }
}

function gMap(x, z) {
    if (x < 0 || x >= MAP_W || z < 0 || z >= MAP_H) return 1;
    return map[z * MAP_W + x];
}

function gHeight(x, z) {
    if (x < 0 || x >= MAP_W || z < 0 || z >= MAP_H) return 5;
    return mapHeight[z * MAP_W + x];
}

function gColor(x, z) {
    if (x < 0 || x >= MAP_W || z < 0 || z >= MAP_H) return { r: 100, g: 100, b: 100 };
    return mapColor[z * MAP_W + x];
}

// RAYCASTING

function castRay(ox, oz, angle) {
    const ca = Math.cos(angle), sa = Math.sin(angle);
    let mx = Math.floor(ox), mz = Math.floor(oz);
    const ddx = Math.abs(1 / ca) || 1e10, ddz = Math.abs(1 / sa) || 1e10;
    let sx, sz, sdx, sdz;
    if (ca < 0) { sx = -1; sdx = (ox - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - ox) * ddx; }
    if (sa < 0) { sz = -1; sdz = (oz - mz) * ddz; } else { sz = 1; sdz = (mz + 1 - oz) * ddz; }
    let side = 0, dist = 0;
    for (let i = 0; i < 120; i++) {
        if (sdx < sdz) { sdx += ddx; mx += sx; side = 0; dist = sdx - ddx; }
        else { sdz += ddz; mz += sz; side = 1; dist = sdz - ddz; }
        if (mx < 0 || mx >= MAP_W || mz < 0 || mz >= MAP_H)
            return { dist: RENDER_DIST, side: 0, mx: 0, mz: 0, wt: 1, wh: 5, hx: 0 };
        if (gMap(mx, mz) > 0) {
            let hx = side === 0 ? oz + dist * sa : ox + dist * ca;
            hx -= Math.floor(hx);
            return { dist, side, mx, mz, wt: gMap(mx, mz), wh: gHeight(mx, mz), hx };
        }
    }
    return { dist: RENDER_DIST, side: 0, mx: 0, mz: 0, wt: 0, wh: 3, hx: 0 };
}

// ============================================================
// BULLET PHYSICS — Real drag model
// ============================================================
class Bullet {
    constructor(x, y, z, dx, dy, dz, wKey, owner) {
        const w = WEAPON_DB[wKey];
        this.x = x; this.y = y; this.z = z;
        const spd = w.bulletSpeed;
        this.vx = dx * spd; this.vy = dy * spd; this.vz = dz * spd;
        this.wKey = wKey;
        this.damage = w.damage;
        this.mass = w.bulletMass;
        this.diam = w.bulletDiam;
        this.area = Math.PI * (this.diam / 2) ** 2;
        this.dragCd = w.dragCoeff;
        this.pen = w.penetration;
        this.hsMul = w.headshotMul;
        this.alive = true;
        this.life = 0;
        this.maxLife = w.range ? (w.range || 80) / spd : 3;
        this.owner = owner || 'player';
        this.trail = [];
    }

    update(dt) {
        if (!this.alive) return;
        this.life += dt;
        if (this.life > this.maxLife) { this.alive = false; return; }

        const speed = Math.sqrt(this.vx ** 2 + this.vy ** 2 + this.vz ** 2);
        if (speed < 10) { this.alive = false; return; }

        // Aerodynamic drag: F = 0.5 * rho * v^2 * Cd * A
        const dragF = 0.5 * PHYSICS.airDensity * speed * speed * this.dragCd * this.area;
        const dragA = dragF / this.mass;
        if (speed > 0) {
            this.vx -= (this.vx / speed) * dragA * dt;
            this.vy -= (this.vy / speed) * dragA * dt;
            this.vz -= (this.vz / speed) * dragA * dt;
        }

        // Gravity
        this.vy -= PHYSICS.gravity * dt;

        // Wind (subtle)
        this.vx += 0.3 * dt;

        // Substep collision
        const subSteps = Math.max(1, Math.ceil(speed * dt / 0.4));
        const subDt = dt / subSteps;

        for (let s = 0; s < subSteps; s++) {
            const nx = this.x + this.vx * subDt;
            const ny = this.y + this.vy * subDt;
            const nz = this.z + this.vz * subDt;

            // Wall collision
            const imx = Math.floor(nx), imz = Math.floor(nz);
            if (imx < 0 || imx >= MAP_W || imz < 0 || imz >= MAP_H) { this.alive = false; return; }
            if (gMap(imx, imz) > 0 && ny <= gHeight(imx, imz) && ny >= 0) {
                this.alive = false;
                spawnImpact(nx, ny, nz, gMap(imx, imz));
                if (decals.length < 200) decals.push({ x: nx, y: ny, z: nz, life: 60 });
                return;
            }
            if (ny <= 0) {
                this.alive = false;
                spawnImpact(nx, 0.01, nz, 0);
                return;
            }

            // Enemy hit detection
            if (this.owner === 'player') {
                for (const e of enemies) {
                    if (!e.alive) continue;
                    const edx = nx - e.x, edz = nz - e.z;
                    const hd = Math.sqrt(edx * edx + edz * edz);
                    if (hd < e.radius && ny >= 0 && ny <= e.height) {
                        const curSpd = Math.sqrt(this.vx ** 2 + this.vy ** 2 + this.vz ** 2);
                        const eRatio = (curSpd / WEAPON_DB[this.wKey].bulletSpeed) ** 2;
                        const hs = ny > e.height * 0.82;
                        let dmg = this.damage * eRatio * (hs ? this.hsMul : 1);
                        // Armor reduction
                        if (e.armor > 0) {
                            const absorbed = Math.min(dmg * 0.5, e.armor);
                            e.armor -= absorbed;
                            dmg -= absorbed * 0.7;
                        }
                        e.takeDamage(Math.max(1, dmg), Math.atan2(this.vz, this.vx));
                        player.hitmarkerTimer = 0.15;
                        player.headshotHit = hs;
                        if (hs) player.score += 25;
                        for (let i = 0; i < 4; i++) spawnParticle(nx, ny, nz, { r: 200, g: 30, b: 30 }, 0.4, 2.5);
                        this.alive = false;
                        return;
                    }
                }
            } else {
                // Enemy bullet -> player
                const pdx = nx - player.x, pdz = nz - player.z;
                const pd = Math.sqrt(pdx * pdx + pdz * pdz);
                if (pd < PHYSICS.playerRadius && ny >= player.y && ny <= player.y + player.height) {
                    const curSpd = Math.sqrt(this.vx ** 2 + this.vy ** 2 + this.vz ** 2);
                    const eRatio = (curSpd / WEAPON_DB[this.wKey].bulletSpeed) ** 2;
                    const hs = ny > player.y + player.height * 0.82;
                    let dmg = this.damage * eRatio * (hs ? this.hsMul : 1);
                    if (hs && player.helmet) dmg *= 0.5;
                    if (player.armor > 0) {
                        const absorbed = Math.min(dmg * 0.55, player.armor);
                        player.armor -= absorbed;
                        dmg -= absorbed * 0.65;
                    }
                    damagePlayer(Math.max(1, dmg), Math.atan2(this.vz, this.vx));
                    this.alive = false;
                    return;
                }
            }

            this.x = nx; this.y = ny; this.z = nz;
        }

        if (this.trail.length < 8) this.trail.push({ x: this.x, y: this.y, z: this.z });
    }
}

function spawnImpact(x, y, z, wt) {
    const colors = {
        0: { r: 150, g: 130, b: 100 }, 1: { r: 190, g: 190, b: 195 },
        2: { r: 175, g: 105, b: 75 }, 3: { r: 190, g: 195, b: 210 },
        4: { r: 155, g: 115, b: 60 },
    };
    const c = colors[wt] || colors[0];
    for (let i = 0; i < 5; i++) spawnParticle(x, y, z, c, 0.3 + Math.random() * 0.4, 2.5);
    if (wt === 3) for (let i = 0; i < 3; i++) spawnParticle(x, y, z, { r: 255, g: 220, b: 80 }, 0.1, 4);
}

function spawnParticle(x, y, z, color, life, speed) {
    if (particles.length > 500) return;
    particles.push({
        x, y, z,
        vx: (Math.random() - 0.5) * speed,
        vy: Math.random() * speed * 0.7 + 0.5,
        vz: (Math.random() - 0.5) * speed,
        color, life, maxLife: life,
        size: 1.5 + Math.random() * 2.5
    });
}

// ============================================================
// ENEMY AI
// ============================================================
class Enemy {
    constructor(x, z, type) {
        this.x = x; this.y = 0; this.z = z;
        this.vx = 0; this.vz = 0; this.yaw = Math.random() * Math.PI * 2;
        this.type = type;
        this.health = type === 'rifle' ? 100 : type === 'heavy' ? 150 : 100;
        this.maxHealth = this.health;
        this.armor = type === 'heavy' ? 100 : (Math.random() < 0.5 ? 50 : 0);
        this.speed = type === 'heavy' ? 2.5 : 3.5;
        this.state = 'patrol';
        this.alertTimer = 0; this.attackTimer = 0;
        this.attackRate = type === 'rifle' ? 0.12 : 0.25;
        this.weapon = type === 'rifle' ? 'ak47' : type === 'heavy' ? 'nova' : 'glock';
        this.accuracy = type === 'rifle' ? 0.08 : 0.15;
        this.detRange = 28; this.atkRange = type === 'heavy' ? 15 : 25;
        this.patrolTarget = { x: x + (Math.random() - 0.5) * 12, z: z + (Math.random() - 0.5) * 12 };
        this.patrolTimer = Math.random() * 3;
        this.lastSeen = null;
        this.alive = true;
        this.radius = 0.4; this.height = 1.8;
        this.painTimer = 0; this.deathTimer = 0;
        this.burstCount = 0; this.burstTimer = 0;
        this.strafeDir = Math.random() > 0.5 ? 1 : -1;
        this.strafeTimer = 0;
        this.color = type === 'rifle' ? { r: 80, g: 100, b: 80 } : type === 'heavy' ? { r: 100, g: 70, b: 70 } : { r: 85, g: 85, b: 95 };
    }

    update(dt) {
        if (!this.alive) { this.deathTimer += dt; return; }
        this.painTimer = Math.max(0, this.painTimer - dt);
        this.attackTimer = Math.max(0, this.attackTimer - dt);
        this.strafeTimer -= dt;
        if (this.strafeTimer <= 0) { this.strafeDir *= -1; this.strafeTimer = 1 + Math.random() * 2; }

        const dx = player.x - this.x, dz = player.z - this.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        const atp = Math.atan2(dz, dx);
        const canSee = this.los(dist, atp) && player.alive;

        switch (this.state) {
            case 'patrol':
                this.patrol(dt);
                if (canSee && dist < this.detRange) { this.state = 'alert'; this.alertTimer = 0.3 + Math.random() * 0.3; }
                break;
            case 'alert':
                this.alertTimer -= dt;
                this.yaw = lerpAngle(this.yaw, atp, 4 * dt);
                if (this.alertTimer <= 0) this.state = 'chase';
                break;
            case 'chase':
                if (canSee) {
                    this.lastSeen = { x: player.x, z: player.z };
                    this.yaw = lerpAngle(this.yaw, atp, 6 * dt);
                    if (dist < this.atkRange) this.state = 'attack';
                    else this.moveToward(player.x, player.z, dt);
                } else if (this.lastSeen) {
                    this.moveToward(this.lastSeen.x, this.lastSeen.z, dt);
                    if (Math.sqrt((this.x - this.lastSeen.x) ** 2 + (this.z - this.lastSeen.z) ** 2) < 1.5) {
                        this.lastSeen = null; this.state = 'patrol';
                    }
                } else { this.state = 'patrol'; }
                break;
            case 'attack':
                if (!canSee || !player.alive) { this.state = 'chase'; break; }
                this.yaw = lerpAngle(this.yaw, atp, 8 * dt);
                if (dist > this.atkRange * 1.3) { this.state = 'chase'; break; }
                // Strafe
                const sa = atp + Math.PI / 2 * this.strafeDir;
                this.moveInDir(sa, this.speed * 0.4, dt);
                if (this.attackTimer <= 0) {
                    this.shoot(dist, atp);
                    this.attackTimer = this.attackRate + Math.random() * 0.1;
                }
                break;
        }
        this.vx *= 0.88; this.vz *= 0.88;
        const nx = this.x + this.vx * dt, nz = this.z + this.vz * dt;
        if (!this.collides(nx, this.z)) this.x = nx;
        if (!this.collides(this.x, nz)) this.z = nz;
    }

    los(dist, angle) {
        const r = castRay(this.x, this.z, angle);
        return r.dist >= dist - 0.5;
    }

    patrol(dt) {
        this.patrolTimer -= dt;
        if (this.patrolTimer <= 0) {
            this.patrolTarget = {
                x: Math.max(2, Math.min(MAP_W - 2, this.x + (Math.random() - 0.5) * 15)),
                z: Math.max(2, Math.min(MAP_H - 2, this.z + (Math.random() - 0.5) * 15))
            };
            this.patrolTimer = 3 + Math.random() * 4;
        }
        const dx = this.patrolTarget.x - this.x, dz = this.patrolTarget.z - this.z;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d > 0.5) {
            this.yaw = lerpAngle(this.yaw, Math.atan2(dz, dx), 2 * dt);
            this.moveToward(this.patrolTarget.x, this.patrolTarget.z, dt, 0.5);
        }
    }

    moveToward(tx, tz, dt, mul = 1) {
        const dx = tx - this.x, dz = tz - this.z, d = Math.sqrt(dx * dx + dz * dz);
        if (d > 0.1) {
            this.vx += (dx / d) * this.speed * mul * dt * 12;
            this.vz += (dz / d) * this.speed * mul * dt * 12;
        }
        const s = Math.sqrt(this.vx ** 2 + this.vz ** 2);
        const ms = this.speed * mul;
        if (s > ms) { this.vx = (this.vx / s) * ms; this.vz = (this.vz / s) * ms; }
    }

    moveInDir(a, spd, dt) {
        this.vx += Math.cos(a) * spd * dt * 12;
        this.vz += Math.sin(a) * spd * dt * 12;
        const s = Math.sqrt(this.vx ** 2 + this.vz ** 2);
        if (s > spd) { this.vx = (this.vx / s) * spd; this.vz = (this.vz / s) * spd; }
    }

    collides(x, z) {
        const mx = Math.floor(x), mz = Math.floor(z);
        for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
            const cx = mx + dx, cz = mz + dz;
            if (gMap(cx, cz) > 0) {
                const clx = Math.max(cx, Math.min(cx + 1, x));
                const clz = Math.max(cz, Math.min(cz + 1, z));
                if ((x - clx) ** 2 + (z - clz) ** 2 < this.radius ** 2) return true;
            }
        }
        return false;
    }

    shoot(dist, angle) {
        const w = WEAPON_DB[this.weapon];
        const spread = this.accuracy * (1 + dist / this.atkRange * 0.3);
        const dy = (player.y + player.height * 0.6 - this.height * 0.7) / dist;
        const bx = this.x + Math.cos(this.yaw) * 0.5;
        const bz = this.z + Math.sin(this.yaw) * 0.5;
        const by = this.height * 0.7;
        const sdx = Math.cos(angle + (Math.random() - 0.5) * spread);
        const sdy = dy + (Math.random() - 0.5) * spread * 0.5;
        const sdz = Math.sin(angle + (Math.random() - 0.5) * spread);
        const len = Math.sqrt(sdx ** 2 + sdy ** 2 + sdz ** 2);
        bullets.push(new Bullet(bx, by, bz, sdx / len, sdy / len, sdz / len, this.weapon, 'enemy'));
        spawnParticle(bx, by, bz, { r: 255, g: 200, b: 50 }, 0.06, 0);
    }

    takeDamage(amount, fromAngle) {
        this.health -= amount;
        this.painTimer = 0.25;
        if (this.state === 'patrol') { this.state = 'alert'; this.alertTimer = 0.15; }
        if (this.health <= 0) {
            this.alive = false; this.deathTimer = 0;
            player.kills++; player.score += 300; player.money += 300;
            player.killFeed.push({ name: this.type.toUpperCase(), time: 4, headshot: amount > this.maxHealth * 0.5 });
            for (let i = 0; i < 10; i++) spawnParticle(this.x, this.height * 0.4, this.z, { r: 180, g: 30, b: 30 }, 0.6, 3);
            if (Math.random() < 0.35) {
                pickups.push({ x: this.x, z: this.z, type: Math.random() < 0.4 ? 'health' : 'ammo', amount: Math.random() < 0.5 ? 25 : 30 });
            }
        }
    }
}

function lerpAngle(from, to, t) {
    let d = to - from;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return from + d * Math.min(t, 1);
}

// ============================================================
// PLAYER UPDATE
// ============================================================
function updatePlayer(dt) {
    if (!player.alive) return;

    const w = getWeapon();
    const wKey = getWeaponKey();

    player.fireTimer = Math.max(0, player.fireTimer - dt);
    player.dmgFlash = Math.max(0, player.dmgFlash - dt * 4);
    player.hitmarkerTimer = Math.max(0, player.hitmarkerTimer - dt);
    player.flashAmount = Math.max(0, player.flashAmount - dt * 0.8);
    player.landingShock = Math.max(0, player.landingShock - dt * 6);

    // Reload
    if (player.reloading && w && w.magSize) {
        player.reloadTimer -= dt;
        if (player.reloadTimer <= 0) {
            if (w.reloadPerShell) {
                if (player.ammo[wKey] < w.magSize && player.reserveAmmo[wKey] > 0) {
                    player.ammo[wKey]++;
                    player.reserveAmmo[wKey]--;
                    if (player.ammo[wKey] < w.magSize && player.reserveAmmo[wKey] > 0) {
                        player.reloadTimer = w.reloadTime;
                    } else {
                        player.reloading = false;
                    }
                } else { player.reloading = false; }
            } else {
                const needed = w.magSize - player.ammo[wKey];
                const avail = Math.min(needed, player.reserveAmmo[wKey]);
                player.ammo[wKey] += avail;
                player.reserveAmmo[wKey] -= avail;
                player.reloading = false;
            }
        }
    }

    // Look
    player.yaw += mouseDX * MOUSE_SENS;
    player.pitch -= mouseDY * MOUSE_SENS;
    player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
    mouseDX = 0; mouseDY = 0;

    // Recoil recovery
    if (w) {
        const rec = w.recoilRecovery || 0.1;
        player.recoilPitch *= (1 - rec);
        player.recoilYaw *= (1 - rec);
    }

    // Scope
    if (w && w.scoped && mouse2Down) {
        player.scoped = true;
    } else {
        player.scoped = false;
    }

    // Crouch
    player.crouching = keys['KeyC'] || keys['ControlLeft'];
    player.height = player.crouching ? PHYSICS.playerCrouchHeight : PHYSICS.playerHeight;
    player.eyeH = player.height * PHYSICS.eyeRatio;

    // Sprint
    const isMoving = keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'];
    player.sprinting = keys['ShiftLeft'] && !player.crouching && player.stamina > 0 && player.onGround && isMoving;
    if (player.sprinting) {
        player.stamina = Math.max(0, player.stamina - PHYSICS.staminaDrain * dt);
        if (player.stamina <= 0) player.sprinting = false;
        player.scoped = false;
    } else {
        player.stamina = Math.min(PHYSICS.staminaMax, player.stamina + PHYSICS.staminaRegen * dt);
    }

    // Movement
    let maxSpd = player.crouching ? PHYSICS.maxCrouchSpeed : (player.sprinting ? PHYSICS.maxSprintSpeed : PHYSICS.maxWalkSpeed);
    // Weapon weight affects speed
    if (w && w.weight) maxSpd *= Math.max(0.75, 1 - w.weight * 0.02);
    if (player.scoped) maxSpd *= 0.4;

    let mx = 0, mz = 0;
    if (keys['KeyW']) { mx += Math.cos(player.yaw); mz += Math.sin(player.yaw); }
    if (keys['KeyS']) { mx -= Math.cos(player.yaw); mz -= Math.sin(player.yaw); }
    if (keys['KeyA']) { mx += Math.cos(player.yaw - Math.PI / 2); mz += Math.sin(player.yaw - Math.PI / 2); }
    if (keys['KeyD']) { mx += Math.cos(player.yaw + Math.PI / 2); mz += Math.sin(player.yaw + Math.PI / 2); }

    const mm = Math.sqrt(mx * mx + mz * mz);
    if (mm > 0) { mx /= mm; mz /= mm; }

    const accel = player.onGround ? (player.sprinting ? PHYSICS.sprintAccel : (player.crouching ? PHYSICS.crouchAccel : PHYSICS.walkAccel)) : 8;
    player.vx += mx * accel * dt;
    player.vz += mz * accel * dt;

    // Ground friction
    const fric = player.onGround ? PHYSICS.frictionGround : PHYSICS.frictionAir;
    const fricFactor = Math.pow(1 - fric, dt * 60);
    player.vx *= fricFactor;
    player.vz *= fricFactor;

    const hSpd = Math.sqrt(player.vx ** 2 + player.vz ** 2);
    if (hSpd > maxSpd) { player.vx = (player.vx / hSpd) * maxSpd; player.vz = (player.vz / hSpd) * maxSpd; }

    player.velocitySmooth += (hSpd - player.velocitySmooth) * dt * 10;

    // Jump
    if (keys['Space'] && player.onGround) {
        player.vy = PHYSICS.jumpImpulse;
        player.onGround = false;
    }

    // Gravity
    if (!player.onGround) player.vy -= PHYSICS.gravity * dt;

    // Collision
    const nx = player.x + player.vx * dt;
    const nz = player.z + player.vz * dt;
    const ny = player.y + player.vy * dt;

    if (!pCollides(nx, player.z)) player.x = nx; else player.vx = 0;
    if (!pCollides(player.x, nz)) player.z = nz; else player.vz = 0;

    const wasOnGround = player.onGround;
    if (ny <= 0) {
        if (!wasOnGround && player.vy < -3) player.landingShock = Math.min(1, Math.abs(player.vy) / 10);
        player.y = 0; player.vy = 0; player.onGround = true;
    } else { player.y = ny; player.onGround = false; }

    player.x = Math.max(1.5, Math.min(MAP_W - 1.5, player.x));
    player.z = Math.max(1.5, Math.min(MAP_H - 1.5, player.z));

    // Weapon bob
    if (hSpd > 0.5 && player.onGround) {
        player.weaponBob += hSpd * dt * (player.sprinting ? 12 : 8);
    } else {
        player.weaponBob += dt * 2;
    }
    player.headBob = (hSpd > 0.5 && player.onGround) ? Math.sin(player.weaponBob) * 0.015 * (player.sprinting ? 2.5 : 1) : player.headBob * 0.93;

    // Weapon sway
    player.weaponSway.x += ((Math.sin(performance.now() * 0.0008) * 2) - player.weaponSway.x) * dt * 3;
    player.weaponSway.y += ((Math.cos(performance.now() * 0.0012) * 1.5) - player.weaponSway.y) * dt * 3;

    // Inspect
    if (player.inspecting) {
        player.inspectTimer += dt;
        if (player.inspectTimer > 3) { player.inspecting = false; player.inspectTimer = 0; }
    }

    // Shooting
    if (mouseDown && player.fireTimer <= 0 && !player.reloading && w && w.type !== 'melee') {
        if (player.ammo[wKey] > 0) {
            if (w.automatic || !player._lmd) {
                fireWeapon(w, wKey);
                player._lmd = true;
            }
        } else { startReload(); }
    }
    // Melee
    if (mouseDown && w && w.type === 'melee' && player.fireTimer <= 0) {
        meleeAttack(w);
        player.fireTimer = w.attackRate;
        player._lmd = true;
    }
    if (!mouseDown) player._lmd = false;

    // Pickups
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        if ((player.x - p.x) ** 2 + (player.z - p.z) ** 2 < 2) {
            if (p.type === 'health') player.health = Math.min(player.maxHealth, player.health + p.amount);
            else if (p.type === 'ammo' && wKey) player.reserveAmmo[wKey] = Math.min((WEAPON_DB[wKey]?.maxAmmo || 120), (player.reserveAmmo[wKey] || 0) + p.amount);
            pickups.splice(i, 1);
        }
    }

    // Fire zones
    for (const fz of fireZones) {
        const fd = Math.sqrt((player.x - fz.x) ** 2 + (player.z - fz.z) ** 2);
        if (fd < fz.radius) damagePlayer(fz.dps * dt, Math.atan2(fz.z - player.z, fz.x - player.x));
    }

    // Kill feed cleanup
    for (let i = player.killFeed.length - 1; i >= 0; i--) {
        player.killFeed[i].time -= dt;
        if (player.killFeed[i].time <= 0) player.killFeed.splice(i, 1);
    }
}

function pCollides(x, z) {
    const mx = Math.floor(x), mz = Math.floor(z);
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
        const cx = mx + dx, cz = mz + dz;
        if (gMap(cx, cz) > 0 && player.y < gHeight(cx, cz)) {
            const clx = Math.max(cx, Math.min(cx + 1, x));
            const clz = Math.max(cz, Math.min(cz + 1, z));
            if ((x - clx) ** 2 + (z - clz) ** 2 < PHYSICS.playerRadius ** 2) return true;
        }
    }
    return false;
}

function fireWeapon(w, wKey) {
    player.ammo[wKey]--;
    player.fireTimer = w.fireRate;
    player.inspecting = false;

    let spread = w.spread;
    const hSpd = Math.sqrt(player.vx ** 2 + player.vz ** 2);
    if (player.sprinting) spread *= w.sprintSpreadMul;
    else if (hSpd > 1) spread *= w.moveSpreadMul;
    if (!player.onGround) spread *= 2.5;
    if (player.crouching) spread *= 0.65;
    if (player.scoped) spread *= 0.15;

    // Recoil pattern (spray)
    player.recoilPattern++;
    const patternMod = Math.min(player.recoilPattern * 0.08, 1.5);

    const pellets = w.pellets || 1;
    for (let p = 0; p < pellets; p++) {
        const sx = (Math.random() - 0.5) * spread + player.recoilYaw;
        const sy = (Math.random() - 0.5) * spread + player.recoilPitch;
        const pt = player.pitch + sy;
        const yw = player.yaw + sx;
        const dx = Math.cos(yw) * Math.cos(pt);
        const dy = Math.sin(pt);
        const dz = Math.sin(yw) * Math.cos(pt);
        const eyeY = player.y + player.eyeH;
        bullets.push(new Bullet(
            player.x + Math.cos(player.yaw) * 0.3, eyeY - 0.1,
            player.z + Math.sin(player.yaw) * 0.3,
            dx, dy, dz, wKey, 'player'
        ));
    }

    // Recoil
    const rv = w.recoilV * (0.8 + Math.random() * 0.4) * (1 + patternMod * 0.3);
    player.recoilPitch += rv;
    player.recoilYaw += (Math.random() - 0.5) * w.recoilH * (1 + patternMod * 0.2);
    player.pitch += rv * 0.4;

    // Muzzle flash
    spawnParticle(
        player.x + Math.cos(player.yaw) * 0.7, player.y + player.eyeH - 0.1,
        player.z + Math.sin(player.yaw) * 0.7,
        { r: 255, g: 210, b: 80 }, 0.04, 0
    );

    // Alert enemies
    const alertR = w.silenced ? 12 : 35;
    for (const e of enemies) {
        if (!e.alive) continue;
        const ed = Math.sqrt((e.x - player.x) ** 2 + (e.z - player.z) ** 2);
        if (ed < alertR) {
            if (e.state === 'patrol') { e.state = 'alert'; e.alertTimer = 0.2; }
            e.lastSeen = { x: player.x, z: player.z };
        }
    }
}

function meleeAttack(w) {
    for (const e of enemies) {
        if (!e.alive) continue;
        const dx = e.x - player.x, dz = e.z - player.z;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d < w.range) {
            const angleDiff = Math.abs(lerpAngle(player.yaw, Math.atan2(dz, dx), 1) - player.yaw);
            if (angleDiff < 0.8) {
                // Backstab check
                const enemyFacing = Math.atan2(Math.sin(e.yaw), Math.cos(e.yaw));
                const approachAngle = Math.atan2(dz, dx);
                let facingDiff = enemyFacing - approachAngle;
                while (facingDiff > Math.PI) facingDiff -= Math.PI * 2;
                while (facingDiff < -Math.PI) facingDiff += Math.PI * 2;
                const backstab = Math.abs(facingDiff) < Math.PI / 3;
                const dmg = backstab ? w.backstabDmg : w.damage;
                e.takeDamage(dmg, Math.atan2(-dz, -dx));
                player.hitmarkerTimer = 0.15;
                player.headshotHit = backstab;
            }
        }
    }
}

function startReload() {
    const wKey = getWeaponKey();
    const w = getWeapon();
    if (!w || !w.magSize || player.reloading) return;
    if (player.ammo[wKey] >= w.magSize || (player.reserveAmmo[wKey] || 0) <= 0) return;
    player.reloading = true;
    player.reloadTimer = w.reloadTime;
    player.recoilPattern = 0;
}

function damagePlayer(amount, fromAngle) {
    player.health = Math.max(0, player.health - amount);
    player.dmgFlash = 1;
    player.dmgDir = fromAngle;
    if (player.health <= 0) {
        player.alive = false;
        player.deaths++;
    }
}

// ============================================================
// GRENADE PHYSICS
// ============================================================
class Grenade {
    constructor(x, y, z, vx, vy, vz, type) {
        this.x = x; this.y = y; this.z = z;
        this.vx = vx; this.vy = vy; this.vz = vz;
        this.type = type;
        const u = UTILITY_DB[type];
        this.fuse = u.fuseTime;
        this.duration = u.duration;
        this.radius = u.radius;
        this.damage = u.damage || 0;
        this.alive = true;
        this.active = false;
        this.activeTimer = 0;
        this.bounciness = 0.4;
    }

    update(dt) {
        if (!this.alive) return;

        if (!this.active) {
            // Physics
            this.vy -= PHYSICS.gravity * dt;
            this.vx *= 0.995; this.vz *= 0.995;
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.z += this.vz * dt;

            // Floor bounce
            if (this.y <= 0.15) {
                this.y = 0.15; this.vy = -this.vy * this.bounciness;
                this.vx *= 0.7; this.vz *= 0.7;
                if (Math.abs(this.vy) < 0.5) { this.vy = 0; }
            }

            // Wall bounce
            const mx = Math.floor(this.x), mz = Math.floor(this.z);
            if (gMap(mx, mz) > 0) {
                this.vx *= -this.bounciness; this.vz *= -this.bounciness;
                this.x -= this.vx * dt * 2; this.z -= this.vz * dt * 2;
            }

            this.fuse -= dt;
            if (this.fuse <= 0) {
                this.active = true;
                this.activate();
            }
        } else {
            this.activeTimer += dt;
            if (this.type === 'molotov' || this.type === 'smoke') {
                if (this.activeTimer >= this.duration) this.alive = false;
            } else {
                this.alive = false;
            }
        }
    }

    activate() {
        if (this.type === 'frag') {
            // Damage enemies and player in radius
            for (const e of enemies) {
                if (!e.alive) continue;
                const d = Math.sqrt((e.x - this.x) ** 2 + (e.z - this.z) ** 2);
                if (d < this.radius) {
                    const dmg = this.damage * (1 - d / this.radius);
                    e.takeDamage(dmg, Math.atan2(e.z - this.z, e.x - this.x));
                }
            }
            const pd = Math.sqrt((player.x - this.x) ** 2 + (player.z - this.z) ** 2);
            if (pd < this.radius) damagePlayer(this.damage * (1 - pd / this.radius) * 0.7, Math.atan2(player.z - this.z, player.x - this.x));
            // Explosion particles
            for (let i = 0; i < 30; i++) spawnParticle(this.x, 0.5, this.z, { r: 255, g: 150 + Math.random() * 100, b: 30 }, 0.5 + Math.random(), 6);
        } else if (this.type === 'flash') {
            const pd = Math.sqrt((player.x - this.x) ** 2 + (player.z - this.z) ** 2);
            if (pd < this.radius) {
                const angle = Math.atan2(this.z - player.z, this.x - player.x);
                let faceDiff = Math.abs(lerpAngle(player.yaw, angle, 1) - player.yaw);
                if (faceDiff < Math.PI / 2) player.flashAmount = Math.min(3, 3 * (1 - pd / this.radius));
                else player.flashAmount = Math.min(1.5, 1.5 * (1 - pd / this.radius));
            }
            for (let i = 0; i < 15; i++) spawnParticle(this.x, 1, this.z, { r: 255, g: 255, b: 255 }, 0.3, 4);
        } else if (this.type === 'smoke') {
            smokeZones.push({ x: this.x, z: this.z, radius: this.radius, timer: this.duration });
        } else if (this.type === 'molotov') {
            fireZones.push({ x: this.x, z: this.z, radius: this.radius, timer: this.duration, dps: this.damage });
        }
    }
}

function throwGrenade(type) {
    const u = UTILITY_DB[type];
    const eyeY = player.y + player.eyeH;
    const dx = Math.cos(player.yaw) * Math.cos(player.pitch);
    const dy = Math.sin(player.pitch);
    const dz = Math.sin(player.yaw) * Math.cos(player.pitch);
    grenades.push(new Grenade(
        player.x + dx * 0.5, eyeY - 0.2, player.z + dz * 0.5,
        dx * u.throwSpeed + player.vx, dy * u.throwSpeed + 2 + player.vy, dz * u.throwSpeed + player.vz,
        type
    ));
    // Remove from inventory
    const idx = player.inventory.utilities.indexOf(type);
    if (idx >= 0) player.inventory.utilities.splice(idx, 1);
}

function toggleBuyMenu() {
    buyMenuOpen = !buyMenuOpen;
    buyMenuEl.style.display = buyMenuOpen ? 'block' : 'none';
    if (buyMenuOpen) renderBuyMenu();
}

function renderBuyMenu() {
    let html = `<h2>BUY MENU</h2><div class="money-display">$ ${player.money}</div>`;

    const categories = [
        { name: 'PISTOLS', items: ['glock', 'usp', 'deagle'] },
        { name: 'SMGS', items: ['mp5', 'p90'] },
        { name: 'RIFLES', items: ['m4a1', 'ak47'] },
        { name: 'SNIPERS', items: ['awp'] },
        { name: 'SHOTGUNS', items: ['nova', 'mag7'] },
        { name: 'GEAR', items: ['kevlar', 'kevhelm'] },
        { name: 'UTILITIES', items: ['smoke', 'flash', 'frag', 'molotov'] },
    ];

    for (const cat of categories) {
        html += `<div class="category"><h3>${cat.name}</h3>`;
        for (const item of cat.items) {
            let w, price, info;
            if (item === 'kevlar') {
                price = 650; info = 'Kevlar Vest'; w = { name: 'Kevlar Vest' };
            } else if (item === 'kevhelm') {
                price = 1000; info = 'Kevlar + Helmet'; w = { name: 'Kevlar + Helmet' };
            } else if (UTILITY_DB[item]) {
                const u = UTILITY_DB[item]; price = u.price; w = u;
                info = u.type.toUpperCase();
            } else {
                w = WEAPON_DB[item]; price = w.price;
                info = `DMG:${w.damage} | ROF:${Math.round(60 / w.fireRate)} RPM | MAG:${w.magSize}`;
            }
            const canAfford = player.money >= price;
            html += `<div class="item" onclick="buyItem('${item}')" style="opacity:${canAfford ? 1 : 0.4}">
                <div><div class="name">${w.name}</div><div class="info">${info}</div></div>
                <div class="price">$${price}</div>
            </div>`;
        }
        html += '</div>';
    }
    html += '<div class="close-hint">Press B to close</div>';
    buyMenuEl.innerHTML = html;
}

window.buyItem = function(item) {
    if (item === 'kevlar') {
        if (player.money >= 650 && player.armor < 100) { player.money -= 650; player.armor = 100; }
    } else if (item === 'kevhelm') {
        if (player.money >= 1000) { player.money -= 1000; player.armor = 100; player.helmet = true; }
    } else if (UTILITY_DB[item]) {
        const u = UTILITY_DB[item];
        const count = player.inventory.utilities.filter(u2 => u2 === item).length;
        if (count < u.maxStack && player.money >= u.price) {
            player.money -= u.price;
            player.inventory.utilities.push(item);
        }
    } else if (WEAPON_DB[item]) {
        const w = WEAPON_DB[item];
        if (player.money >= w.price) {
            player.money -= w.price;
            if (w.type === 'pistol') {
                player.inventory.secondary = item;
            } else {
                player.inventory.primary = item;
            }
            player.ammo[item] = w.magSize;
            player.reserveAmmo[item] = w.maxAmmo;
        }
    }
    renderBuyMenu();
};

function spawnEnemies() {

    const spawns = [
        [52, 52, 'pistol'], [54, 54, 'rifle'], [50, 55, 'rifle'],
        [55, 50, 'heavy'], [48, 52, 'rifle'],
        [42, 42, 'rifle'], [44, 44, 'pistol'], [46, 40, 'rifle'],
        [35, 45, 'rifle'], [40, 35, 'heavy'],
        [30, 30, 'rifle'], [32, 28, 'pistol'], [28, 35, 'rifle'],
        [38, 25, 'rifle'], [45, 22, 'heavy'],
        [35, 38, 'rifle'], [25, 42, 'pistol'], [20, 45, 'rifle'],

        [30, 15, 'rifle'], [25, 20, 'pistol'],
    ];
